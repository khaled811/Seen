name: seen_booking
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  graphql_flutter: ^5.1.2
  flutter_secure_storage: ^10.3.4
  intl: ^0.19.0
  fpdart: ^1.2.0
  logger: ^2.8.0
  http: ^0.13.6
  flutter_localizations:
    sdk: flutter
  phosphor_flutter: ^2.1.0
  # Vector brand assets (logos, patterns, Figma icons) under assets/vectors/
  # and assets/icons/. Phosphor stays as the fallback icon set.
  # Pinned: flutter_svg >=2.0.10 requires http ^1.0.0, but the network layer
  # (graphql_client_factory.dart) is on http ^0.13.6. Revisit with an http upgrade.
  flutter_svg: 2.0.9
  lottie: ^2.7.0
  shared_preferences: 2.2.3
  vibration: ^3.1.8
  wakelock_plus: ^1.3.0
  just_audio: ^0.9.46
  adhan: ^2.0.0+1
  geolocator: ^12.0.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  hijri: ^3.0.1
  flutter_compass: ^0.8.1
  share_plus: 10.1.4
  package_info_plus: ^8.3.1
  image_picker: ^1.1.2
  file_picker: ^8.3.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0
  golden_toolkit: ^0.15.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates the synthetic `flutter_gen` localization package from the ARB
  # files declared in l10n.yaml.
  generate: true

  # Interactive Lottie motion icons — see SeenMotionIcon
  # (lib/core/presentation/widgets/motion_icon.dart), which plays them on
  # demand and falls back to a static Phosphor icon if a file is missing or
  # fails to parse. `assets/images/` holds decorative art (e.g. the wallet
  # card's background pattern — see SeenWalletCard.backgroundPattern).
  assets:
    - assets/motion icons/
    - assets/images/
    # Figma brand SVGs: logos, background patterns (assets/vectors/) and the
    # custom icon set (assets/icons/). Render with flutter_svg.
    - assets/vectors/
    - assets/icons/
    - assets/icons/account/
    - assets/icons/agents/
    - assets/icons/wallet/
    - assets/icons/catalog/
    - assets/icons/review/
    - assets/icons/requests/
    - assets/icons/auth/
    - assets/icons/notifications/
    # Spiritual hub: duas.json (docs/spiritual_feature/05-content.md) and the
    # mock dua audio (a 3 s silent WAV) used until real recitations are added.
    - assets/data/
    - assets/audio/duas/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

  # Design system typography (lib/core/theme/) — IBM Plex Sans Arabic is now
  # bundled (assets/fonts/); `fontFamily: 'IBM Plex Sans Arabic'` (see
  # lib/core/theme/seen_typography.dart) resolves to it. IBM Plex Mono's
  # .ttf is NOT in the repo yet, so that family stays commented out —
  # `fontFamily: 'IBM Plex Mono'` safely falls back to the platform default
  # until it's added; declaring an asset path that doesn't exist would fail
  # `flutter build`/`flutter run`.
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Official Figma typeface (SeenFonts.sans). IBM Plex Sans Arabic above is
    # kept as its fontFamilyFallback.
    - family: Thmanyah Sans
      fonts:
        - asset: assets/fonts/thmanyahsans-Light.otf
          weight: 300
        - asset: assets/fonts/thmanyahsans-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyahsans-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyahsans-Black.otf
          weight: 900
  #   - family: IBM Plex Mono
  #     fonts:
  #       - asset: assets/fonts/IBMPlexMono-Medium.ttf
  #         weight: 500

  # Spiritual & Manasik Hub fonts (lib/features/spiritual/presentation/theme/
  # spiritual_tokens.dart — SpiritualFonts). Tajawal ships 400/500/700 only, so
  # the 700 file also serves 800 (the design's heavy weight). Amiri (hadith
  # duas) is NOT bundled yet; until it is, those texts fall back to the
  # platform font — uncomment once Amiri-Regular.ttf is in assets/fonts/.
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 800
    - family: KFGQPC Uthmanic Script HAFS
      fonts:
        - asset: assets/fonts/KFGQPC-Uthmanic-Script-HAFS-Regular.otf
  #   - family: Amiri
  #     fonts:
  #       - asset: assets/fonts/Amiri-Regular.ttf
