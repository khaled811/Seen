<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>المسبحة التفاعلية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{flex-shrink:0}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; font-family: Tajawal, 'IBM Plex Sans Arabic', sans-serif; color: #44474E; display: flex; flex-direction: column; gap: 14px; padding: 8px 16px 24px 16px; position: relative; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <a href="Main.dc.html" aria-label="إغلاق المسبحة" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E7E8EA; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-size: 19px; font-weight: 800; color: #1A1C1E">المسبحة</span>
    <button onClick="{{reset}}" style="height: 48px; padding: 0 14px; border-radius: 24px; background: #FFFFFF; border: 1px solid #D5D7DB; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; color: #44474E">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"></path><path d="M4.4 4.2v3.6H8"></path></svg>
      تصفير
    </button>
  </header>

  <!-- Dhikr selector -->
  <button onClick="{{openPicker}}" aria-haspopup="listbox" style="min-height: 64px; border-radius: 18px; border: 1px solid #E2E3E6; background: #FFFFFF; box-shadow: 0 2px 12px rgba(26,28,30,0.04); padding: 8px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
      <span style="font-size: 13px; font-weight: 500; color: #74777F">الذكر الحالي</span>
      <span style="font-size: 21px; font-weight: 800; color: #1A1C1E">{{dhikr}}</span>
    </span>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
  </button>

  <!-- Target -->
  <div role="radiogroup" aria-label="الهدف" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #ECEDEF; border-radius: 16px">
    <sc-for list="{{targets}}" as="t" hint-placeholder-count="3">
      <button role="radio" aria-checked="{{t.sel}}" onClick="{{t.pick}}" style="height: 48px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 700; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.sh}}">{{t.label}}</button>
    </sc-for>
  </div>

  <!-- Tap surface -->
  <button onClick="{{tap}}" aria-label="{{tapLabel}}" style="flex-grow: 1; border-radius: 32px; border: 1px solid {{surfaceBorder}}; background: {{surfaceBg}}; box-shadow: 0 2px 12px rgba(26,28,30,0.04); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; transform: {{scale}}; transition: transform 100ms ease, background 200ms ease">
    <span style="position: relative; width: 272px; height: 272px; display: block">
      <svg width="272" height="272" viewBox="0 0 280 280" aria-hidden="true" style="display: block; transform: scaleX(-1)">
        <circle cx="140" cy="140" r="128" fill="none" stroke="#ECEDEF" stroke-width="14"></circle>
        <circle cx="140" cy="140" r="128" fill="none" stroke="{{ringColor}}" stroke-width="14" stroke-linecap="round" stroke-dasharray="804.25" stroke-dashoffset="{{dashOffset}}" transform="rotate(-90 140 140)" style="transition: stroke-dashoffset 160ms ease"></circle>
      </svg>
      <span style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="font-size: 96px; font-weight: 800; color: #1A1C1E; line-height: 1">{{countAr}}</span>
        <span style="font-size: 24px; font-weight: 700; color: #44474E">{{targetText}}</span>
      </span>
    </span>
    <span style="display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 18px; background: {{hintBg}}; font-size: 16px; font-weight: 700; color: {{hintFg}}">{{hint}}</span>
  </button>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="background: #FFFFFF; border: 1px solid #EEEFF1; border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; color: #74777F">الدورات المكتملة</span>
      <span style="font-size: 22px; font-weight: 800; color: #1A1C1E">{{roundsAr}}</span>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #EEEFF1; border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; color: #74777F">مجموع اليوم</span>
      <span style="font-size: 22px; font-weight: 800; color: #1A1C1E">{{totalAr}}</span>
    </div>
  </div>

  <!-- Picker sheet -->
  <sc-if value="{{picker}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(26,28,30,0.36); display: flex; flex-direction: column; justify-content: flex-end">
      <button onClick="{{closePicker}}" aria-label="إغلاق" style="flex-grow: 1; border: 0; background: transparent"></button>
      <section role="listbox" aria-label="اختر الذكر" style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 16px 24px 16px; display: flex; flex-direction: column; gap: 4px">
        <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D5D7DB; margin-bottom: 8px"></span>
        <span style="font-size: 18px; font-weight: 800; color: #1A1C1E; padding: 0 8px 8px 8px">اختر الذكر</span>
        <sc-for list="{{options}}" as="o" hint-placeholder-count="8">
          <button role="option" aria-selected="{{o.sel}}" onClick="{{o.pick}}" style="min-height: 56px; border: 0; border-radius: 14px; background: {{o.bg}}; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 18px; font-weight: {{o.weight}}; color: {{o.fg}}">
            {{o.label}}
            <sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{o.fg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7B2D3B","options":["#7B2D3B","#3F6654","#1F4E5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 4, count: 33, target: 100, rounds: 0, total: 245, complete: false, picker: false, pressed: false };
  }
  componentWillUnmount() { clearTimeout(this._pt); }
  ar(n) { return String(n).replace(/[0-9]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[Number(d)]; }); }
  renderVals() {
    var self = this, s = this.state;
    var accent = this.props.accent ?? '#7B2D3B';
    var tones = { '#7B2D3B': ['#F6ECEE', '#DDB4BC'], '#3F6654': ['#E9F1EC', '#B4CCBD'], '#1F4E5F': ['#E7F0F3', '#AFC8D2'] };
    var tn = tones[String(accent).toUpperCase()] || ['#F1F2F4', '#C9CBD0'];
    var list = ['سبحان الله', 'الحمد لله', 'الله أكبر', 'لا إله إلا الله', 'سبحان الله وبحمده', 'أستغفر الله', 'لا حول ولا قوة إلا بالله', 'اللهم صلِّ على محمد'];
    var C = 804.25;
    var open = s.target === 0;
    var p = open ? (s.count % 100) / 100 : Math.min(1, s.count / s.target);

    var tap = function () {
      var c = s.complete ? 1 : s.count + 1;
      var done = !open && c >= s.target;
      try { if (navigator.vibrate) navigator.vibrate(done ? [60, 80, 60] : 15); } catch (e) {}
      clearTimeout(self._pt);
      self._pt = setTimeout(function () { self.setState({ pressed: false }); }, 110);
      self.setState({ count: c, complete: done, rounds: done ? s.rounds + 1 : s.rounds, total: s.total + 1, pressed: true });
    };
    var targets = [[33, '٣٣'], [100, '١٠٠'], [0, 'مفتوح']].map(function (t) {
      var on = s.target === t[0];
      return { label: t[1], sel: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#1A1C1E' : '#44474E',
        sh: on ? '0 1px 4px rgba(26,28,30,0.08)' : 'none',
        pick: function () { self.setState({ target: t[0], complete: !!t[0] && s.count >= t[0] }); } };
    });
    var options = list.map(function (l, i) {
      var on = s.idx === i;
      return { label: l, on: on, sel: on ? 'true' : 'false', bg: on ? tn[0] : 'transparent', fg: on ? accent : '#1A1C1E', weight: on ? '800' : '500',
        pick: function () { self.setState({ idx: i, count: 0, complete: false, picker: false }); } };
    });
    return {
      accent: accent, dhikr: list[s.idx], targets: targets, options: options,
      tap: tap,
      tapLabel: list[s.idx] + ' — العدد ' + this.ar(s.count) + '، اضغط للتسبيح',
      countAr: this.ar(s.count),
      targetText: open ? 'بلا حد' : '/ ' + this.ar(s.target),
      dashOffset: (C * (1 - p)).toFixed(2),
      ringColor: s.complete ? '#3F6654' : accent,
      surfaceBg: s.complete ? '#F3F8F5' : '#FFFFFF',
      surfaceBorder: s.complete ? '#B4CCBD' : '#EEEFF1',
      scale: s.pressed ? 'scale(0.985)' : 'scale(1)',
      hint: s.complete ? 'اكتملت الدورة — اضغط للبدء من جديد' : 'اضغط في أي مكان للعدّ',
      hintBg: s.complete ? '#E3EFE7' : '#F6F7F8',
      hintFg: s.complete ? '#2F5442' : '#44474E',
      roundsAr: this.ar(s.rounds), totalAr: this.ar(s.total),
      reset: function () { self.setState({ count: 0, complete: false }); },
      picker: s.picker,
      openPicker: function () { self.setState({ picker: true }); },
      closePicker: function () { self.setState({ picker: false }); }
    };
  }
}
</script>
</body>
</html>
