<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>فهرس المصحف</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input{font-family:inherit}
button{cursor:pointer}
svg{flex-shrink:0}
input::placeholder{color:#74777F}
input:focus{outline:none}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F9FA; font-family: Tajawal, 'IBM Plex Sans Arabic', sans-serif; color: #44474E; display: flex; flex-direction: column">

  <header style="padding: 8px 16px 12px 16px; display: flex; flex-direction: column; gap: 12px; background: #F8F9FA">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="Main.dc.html" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E7E8EA; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 21px; font-weight: 800; color: #1A1C1E">المصحف الشريف</h1>
      <span style="width: 48px; height: 48px"></span>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: #FFFFFF; border: 1px solid #E2E3E6; border-radius: 16px; box-shadow: 0 2px 12px rgba(26,28,30,0.04)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      <input type="search" value="{{q}}" onChange="{{onSearch}}" placeholder="ابحث باسم السورة أو رقمها أو نص الآية" aria-label="بحث في المصحف" style="flex-grow: 1; min-width: 0; height: 48px; border: 0; background: transparent; font-size: 17px; color: #1A1C1E">
      <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}">
        <button onClick="{{clearQ}}" aria-label="مسح البحث" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #F1F2F4; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </sc-if>
    </label>

    <div role="tablist" aria-label="طريقة التصفح" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #ECEDEF; border-radius: 16px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="height: 48px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 700; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.sh}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex-grow: 1; overflow-y: auto; padding: 0 16px 16px 16px; display: flex; flex-direction: column; gap: 12px">

    <!-- Last read -->
    <sc-if value="{{noQ}}" hint-placeholder-val="{{ true }}">
      <section style="background: #FFFFFF; border: 1px solid #EEEFF1; border-radius: 20px; box-shadow: 0 2px 12px rgba(26,28,30,0.04); padding: 14px 16px; display: flex; align-items: center; gap: 12px">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: {{tint}}; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
          <span style="font-size: 14px; font-weight: 500; color: #74777F">آخر قراءة</span>
          <span style="font-size: 17px; font-weight: 800; color: #1A1C1E">سورة الكهف · الآية ٣</span>
          <span style="font-size: 14px; color: #44474E">صفحة ٢٩٣ · الجزء ١٥</span>
        </div>
        <a href="Quran.dc.html" style="height: 48px; padding: 0 18px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700">
          متابعة
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        </a>
      </section>
    </sc-if>

    <!-- Ayah text search hint -->
    <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}">
      <a href="Quran.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; background: {{tint}}; border-radius: 16px; color: {{accent}}; font-size: 16px; font-weight: 700">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
        <span style="flex-grow: 1">البحث في نص الآيات عن «{{q}}»</span>
      </a>
    </sc-if>

    <section style="background: #FFFFFF; border: 1px solid #EEEFF1; border-radius: 20px; box-shadow: 0 2px 12px rgba(26,28,30,0.04); padding: 4px 16px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <a href="Quran.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 10px 0; border-bottom: 1px solid {{r.line}}; box-sizing: border-box">
          <span style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <span style="position: absolute; width: 31px; height: 31px; border: 1.5px solid {{r.frame}}; border-radius: 7px; transform: rotate(45deg)"></span>
            <span style="position: absolute; width: 31px; height: 31px; border: 1.5px solid {{r.frame}}; border-radius: 7px"></span>
            <span style="position: relative; font-size: 15px; font-weight: 800; color: #1A1C1E">{{r.badge}}</span>
          </span>
          <span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
            <span style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap">
              <span style="font-size: 19px; font-weight: 800; color: #1A1C1E">{{r.title}}</span>
              <span dir="ltr" style="font-size: 14px; font-weight: 500; color: #74777F">{{r.latin}}</span>
            </span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; color: #44474E">
              <sc-if value="{{r.meccan}}" hint-placeholder-val="{{ true }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5L12 4l8 3.5v9L12 20l-8-3.5z"></path><path d="M4 7.5l8 3.5 8-3.5M12 11v9"></path></svg>
              </sc-if>
              <sc-if value="{{r.medinan}}" hint-placeholder-val="{{ false }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20h14M6.5 20v-6a5.5 5.5 0 0 1 11 0v6M12 8.5V5M10.5 5h3"></path></svg>
              </sc-if>
              {{r.meta}}
            </span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: center; min-width: 40px; flex-shrink: 0">
            <span style="font-size: 12px; font-weight: 500; color: #74777F">صفحة</span>
            <span style="font-size: 17px; font-weight: 800; color: #1A1C1E">{{r.page}}</span>
          </span>
        </a>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; padding: 28px 0; text-align: center; font-size: 16px; color: #44474E">لا توجد نتائج مطابقة في هذه القائمة</p>
      </sc-if>
    </section>
  </main>

  <nav aria-label="التنقل الرئيسي" style="background: #FFFFFF; border-top: 1px solid #E7E8EA; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 20px 8px">
    <a href="Main.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #44474E; font-size: 13px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20h-5v-5.5H9V20H4z"></path></svg>
      الرئيسية
    </a>
    <a href="Tawaf.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #44474E; font-size: 13px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5L12 4l7 3.5v10L12 21l-7-3.5z"></path><path d="M5 10.5l7 3.5 7-3.5"></path></svg>
      المناسك
    </a>
    <a href="#" aria-current="page" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{accent}}; font-size: 13px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.8C10.2 5.4 7.4 4.8 4 5.2v13c3.4-.4 6.2.2 8 1.6 1.8-1.4 4.6-2 8-1.6v-13c-3.4-.4-6.2.2-8 1.6z"></path><path d="M12 6.8v13"></path></svg>
      المصحف
    </a>
    <a href="#" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #44474E; font-size: 13px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"></circle><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4s6.3 1.8 7.5 5.4"></path></svg>
      حسابي
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7B2D3B","options":["#7B2D3B","#3F6654","#1F4E5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', tab: 'surah' };
  }
  ar(n) { return String(n).replace(/[0-9]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[Number(d)]; }); }
  renderVals() {
    var self = this, s = this.state;
    var accent = this.props.accent ?? '#7B2D3B';
    var tones = { '#7B2D3B': '#F6ECEE', '#3F6654': '#E9F1EC', '#1F4E5F': '#E7F0F3' };
    var tint = tones[String(accent).toUpperCase()] || '#F1F2F4';

    var surahs = [
      [1, 'الفاتحة', "Al-Fatihah", 'm', 7, 1], [2, 'البقرة', "Al-Baqarah", 'd', 286, 2],
      [3, 'آل عمران', "Al 'Imran", 'd', 200, 50], [4, 'النساء', "An-Nisa", 'd', 176, 77],
      [5, 'المائدة', "Al-Ma'idah", 'd', 120, 106], [6, 'الأنعام', "Al-An'am", 'm', 165, 128],
      [7, 'الأعراف', "Al-A'raf", 'm', 206, 151], [8, 'الأنفال', "Al-Anfal", 'd', 75, 177],
      [9, 'التوبة', "At-Tawbah", 'd', 129, 187], [10, 'يونس', "Yunus", 'm', 109, 208],
      [11, 'هود', "Hud", 'm', 123, 221], [12, 'يوسف', "Yusuf", 'm', 111, 235],
      [13, 'الرعد', "Ar-Ra'd", 'd', 43, 249], [14, 'إبراهيم', "Ibrahim", 'm', 52, 255],
      [15, 'الحجر', "Al-Hijr", 'm', 99, 262], [16, 'النحل', "An-Nahl", 'm', 128, 267],
      [17, 'الإسراء', "Al-Isra", 'm', 111, 282], [18, 'الكهف', "Al-Kahf", 'm', 110, 293]
    ];
    var juz = [
      [1, 'الفاتحة', 1, 1], [2, 'البقرة', 142, 22], [3, 'البقرة', 253, 42], [4, 'آل عمران', 93, 62],
      [5, 'النساء', 24, 82], [6, 'النساء', 148, 102], [7, 'المائدة', 82, 121], [8, 'الأنعام', 111, 142],
      [9, 'الأعراف', 88, 162], [10, 'الأنفال', 41, 182]
    ];
    var marks = [
      ['آية الكرسي', 'البقرة', 255, 42], ['سورة الكهف', 'الكهف', 10, 294],
      ['سورة يس', 'يس', 1, 440], ['سورة الملك', 'الملك', 1, 562]
    ];

    var q = s.q.trim().toLowerCase();
    var qn = q.replace(/[٠-٩]/g, function (d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); });
    var rows = [];
    if (s.tab === 'surah') {
      rows = surahs.filter(function (x) {
        return !q || x[1].indexOf(s.q.trim()) > -1 || x[2].toLowerCase().indexOf(q) > -1 || String(x[0]) === qn;
      }).map(function (x) {
        var m = x[3] === 'm';
        return { badge: self.ar(x[0]), title: x[1], latin: x[2], meccan: m, medinan: !m,
          meta: (m ? 'مكية' : 'مدنية') + ' · ' + self.ar(x[4]) + ' آية', page: self.ar(x[5]),
          frame: x[0] === 18 ? accent : '#C9C7C0' };
      });
    } else if (s.tab === 'juz') {
      rows = juz.filter(function (x) {
        return !q || x[1].indexOf(s.q.trim()) > -1 || String(x[0]) === qn;
      }).map(function (x) {
        return { badge: self.ar(x[0]), title: 'الجزء ' + self.ar(x[0]), latin: 'Juz ' + x[0], meccan: false, medinan: false,
          meta: 'يبدأ من ' + x[1] + ' · الآية ' + self.ar(x[2]), page: self.ar(x[3]),
          frame: x[0] === 15 ? accent : '#C9C7C0' };
      });
    } else {
      rows = marks.filter(function (x) {
        return !q || x[0].indexOf(s.q.trim()) > -1 || x[1].indexOf(s.q.trim()) > -1;
      }).map(function (x, i) {
        return { badge: self.ar(i + 1), title: x[0], latin: '', meccan: false, medinan: false,
          meta: x[1] + ' · الآية ' + self.ar(x[2]), page: self.ar(x[3]), frame: accent };
      });
    }
    rows.forEach(function (r, i) { r.line = i === rows.length - 1 ? 'transparent' : '#EEEFF1'; });

    var tabDefs = [['surah', 'السور'], ['juz', 'الأجزاء'], ['marks', 'الإشارات']];
    var tabs = tabDefs.map(function (t) {
      var on = s.tab === t[0];
      return { label: t[1], sel: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent',
        fg: on ? '#1A1C1E' : '#44474E', sh: on ? '0 1px 4px rgba(26,28,30,0.08)' : 'none',
        pick: function () { self.setState({ tab: t[0] }); } };
    });

    return {
      accent: accent, tint: tint, tabs: tabs, rows: rows,
      q: s.q, hasQ: q.length > 0, noQ: q.length === 0, empty: rows.length === 0,
      onSearch: function (e) { self.setState({ q: e.target.value }); },
      clearQ: function () { self.setState({ q: '' }); }
    };
  }
}
</script>
</body>
</html>
