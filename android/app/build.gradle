plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.example.seen_booking"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // flutter_local_notifications uses java.time on API < 26.
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.seen_booking"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // flutter_secure_storage (EncryptedSharedPreferences) requires API 23+;
        // Flutter's own default (21) is no longer sufficient.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    // flutter_secure_storage pulls com.google.crypto.tink:tink-android, which
    // pulls a gson recent enough to depend on error_prone_annotations 2.41.0.
    // That jar's class files crash D8 on this project's AGP 7.3.0 toolchain
    // (NullPointerException in mergeExtDexDebug). Pin gson down to a version
    // whose error_prone_annotations transitive dep this D8 can still dex.
    // Root cause is really the AGP/Gradle version being ~2 years old; this
    // pin is the minimal fix — revisit if the Android toolchain is upgraded.
    configurations.all {
        resolutionStrategy {
            force "com.google.code.gson:gson:2.10.1"
            // tink-android also depends on error_prone_annotations directly
            // (not only via gson) — pin it too, to a version compiled
            // against an older class-file format this D8 can dex.
            force "com.google.errorprone:error_prone_annotations:2.23.0"
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.2.2"
}

flutter {
    source = "../.."
}
